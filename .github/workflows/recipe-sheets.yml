name: 料理動画 → レシピ集（Google スプレッドシート）

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "追加で処理する YouTube URL（改行またはカンマ区切り・任意）"
        required: false
        type: string
      force:
        description: "取得済み・変換済みの動画もやり直す"
        required: false
        type: boolean
        default: false
  push:
    paths:
      - "recipe-sheets/videos.txt"
      - "recipe-sheets/data/*.json"

permissions:
  contents: write

concurrency:
  group: recipe-sheets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recipe-sheets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: recipe-sheets/requirements.txt

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 1) YouTube からメタ情報と字幕を取得
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          FORCE=""
          if [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
          python fetch_videos.py $FORCE "${{ inputs.urls }}"

      - name: 2) Claude でレシピに構造化
        if: ${{ env.HAS_ANTHROPIC == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          FORCE=""
          if [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
          python make_recipes.py $FORCE

      - name: 3) Google スプレッドシートへ書き込み
        if: ${{ env.HAS_GOOGLE == 'true' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RECIPE_SPREADSHEET_ID: ${{ secrets.RECIPE_SPREADSHEET_ID }}
          SHARE_WITH_EMAIL: ${{ vars.SHARE_WITH_EMAIL }}
        run: python write_sheet.py

      - name: 3') Excel ファイルも出力（Google 未設定時のフォールバック兼バックアップ）
        run: python write_sheet.py --xlsx ../recipe-sheets-output/レシピ集.xlsx

      - name: Excel をアーティファクトとして保存
        uses: actions/upload-artifact@v4
        with:
          name: recipe-sheets-xlsx
          path: recipe-sheets-output/レシピ集.xlsx
          if-no-files-found: ignore

      - name: 取得データとレシピ JSON をリポジトリに保存（再実行時のキャッシュ）
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipe-sheets/data recipe-sheets/recipes
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "recipe-sheets: 動画データとレシピを更新 [skip ci]"
            git push
          fi
    env:
      HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_GOOGLE: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
